<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bezelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="ecgGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Monitor Outer Bezel -->
  <rect width="1000" height="700" rx="20" fill="url(#bezelGrad)" stroke="#475569" stroke-width="6" />

  <!-- Display Area -->
  <rect x="25" y="25" width="950" height="650" rx="8" fill="#020617" />

  <!-- Header Banner -->
  <rect x="25" y="25" width="950" height="50" fill="#0f172a" />
  <text x="45" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">BED 07 | ADULT ICU | PATIENT #48291</text>
  <rect x="580" y="33" width="375" height="34" rx="6" fill="#ef4444" />
  <text x="600" y="56" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">ALARM: DESATURATION &amp; TACHYCARDIA</text>

  <!-- Channel 1: ECG Lead II (Green) -->
  <!-- Left: Numeric Box -->
  <rect x="40" y="90" width="220" height="125" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2" />
  <text x="55" y="118" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">ECG  HR (bpm)</text>
  <text x="55" y="195" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="76" font-weight="800" filter="url(#ecgGlow)">142</text>
  <text x="210" y="135" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">HI</text>
  <!-- Right: ECG Waveform -->
  <path d="M 280 155 L 340 155 L 350 145 L 360 165 L 370 100 L 385 190 L 395 155 L 420 155 
           L 440 140 L 460 155 L 500 155 L 510 145 L 520 165 L 530 100 L 545 190 L 555 155 
           L 580 155 L 600 140 L 620 155 L 660 155 L 670 145 L 680 165 L 690 100 L 705 190 
           L 715 155 L 740 155 L 760 140 L 780 155 L 820 155 L 830 145 L 840 165 L 850 100 
           L 865 190 L 875 155 L 940 155" fill="none" stroke="#22c55e" stroke-width="3" filter="url(#ecgGlow)" />

  <!-- Channel 2: SpO2 Pulse Oximetry (Cyan) -->
  <rect x="40" y="235" width="220" height="125" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="2" />
  <text x="55" y="263" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">SpO2  %</text>
  <text x="55" y="340" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="76" font-weight="800" filter="url(#ecgGlow)">84</text>
  <text x="210" y="280" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">LO</text>
  <!-- Right: Pleth Waveform -->
  <path d="M 280 320 Q 300 320 310 270 Q 320 255 330 280 Q 340 275 350 320 
           Q 370 320 380 270 Q 390 255 400 280 Q 410 275 420 320 
           Q 440 320 450 270 Q 460 255 470 280 Q 480 275 490 320 
           Q 510 320 520 270 Q 530 255 540 280 Q 550 275 560 320 
           Q 580 320 590 270 Q 600 255 610 280 Q 620 275 630 320 
           Q 650 320 660 270 Q 670 255 680 280 Q 690 275 700 320 
           Q 720 320 730 270 Q 740 255 750 280 Q 760 275 770 320 
           Q 790 320 800 270 Q 810 255 820 280 Q 830 275 840 320 
           L 940 320" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#ecgGlow)" />

  <!-- Channel 3: Blood Pressure NIBP / ART (Red) -->
  <rect x="40" y="380" width="220" height="125" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="2" />
  <text x="55" y="408" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">NIBP  SYS/DIA</text>
  <text x="55" y="480" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="56" font-weight="800">78/45</text>
  <text x="180" y="445" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">(56)</text>
  <text x="210" y="415" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">LO</text>
  <!-- Right: Arterial Pressure Pulse Waveform -->
  <path d="M 280 460 Q 295 460 305 400 Q 315 425 320 420 Q 330 460 340 460 
           Q 355 460 365 400 Q 375 425 380 420 Q 390 460 400 460 
           Q 415 460 425 400 Q 435 425 440 420 Q 450 460 460 460 
           Q 475 460 485 400 Q 495 425 500 420 Q 510 460 520 460 
           Q 535 460 545 400 Q 555 425 560 420 Q 570 460 580 460 
           Q 595 460 605 400 Q 615 425 620 420 Q 630 460 640 460 
           L 940 460" fill="none" stroke="#f87171" stroke-width="3" filter="url(#ecgGlow)" />

  <!-- Channel 4: Respiration Rate (Yellow) -->
  <rect x="40" y="525" width="220" height="125" rx="8" fill="#422006" stroke="#ca8a04" stroke-width="2" />
  <text x="55" y="553" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">RESP  (br/min)</text>
  <text x="55" y="630" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="76" font-weight="800">32</text>
  <text x="210" y="570" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">HI</text>
  <!-- Right: Respiration Waveform -->
  <path d="M 280 600 Q 320 540 360 600 Q 400 660 440 600 
           Q 480 540 520 600 Q 560 660 600 600 
           Q 640 540 680 600 Q 720 660 760 600 
           Q 800 540 840 600 Q 880 660 940 600" fill="none" stroke="#facc15" stroke-width="3" />
</svg>
