<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0f172a" />
  <!-- Patient Monitor with Broken / Degraded LCD Segments -->
  <rect x="100" y="70" width="600" height="460" rx="16" fill="#020617" stroke="#334155" stroke-width="4" />
  <rect x="130" y="100" width="540" height="340" rx="8" fill="#030712" />
  
  <!-- Damaged 7-segment display readouts with missing segments -->
  <g font-family="'JetBrains Mono', monospace" font-size="72" font-weight="900">
    <!-- Heart rate unreadable broken segments -->
    <text x="160" y="220" fill="#22c55e" opacity="0.3">--</text>
    <rect x="230" y="170" width="30" height="10" fill="#22c55e" />
    <rect x="250" y="190" width="10" height="25" fill="#22c55e" />
    
    <!-- SpO2 missing numbers / garbled symbols -->
    <text x="440" y="220" fill="#38bdf8">??</text>
    <path d="M 430 230 L 520 230" stroke="#38bdf8" stroke-dasharray="8 6" stroke-width="4" />
    
    <!-- Blood pressure obscured -->
    <text x="160" y="360" fill="#e2e8f0" opacity="0.4">--- / --</text>
  </g>
  
  <rect x="180" y="470" width="440" height="45" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
  <text x="200" y="498" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">CLINICAL DE-IDENTIFIED: UNREADABLE LCD ARTIFACT</text>
</svg>
