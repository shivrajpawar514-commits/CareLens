<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="30%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="70%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <rect x="40" y="40" width="720" height="720" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="60" y="60" width="680" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <text x="80" y="98" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">CLINICAL UNIT: PEDIATRIC ICU - BED 03</text>
  <rect x="580" y="75" width="140" height="30" rx="6" fill="#ef4444" />
  <text x="602" y="96" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">AUDIT ACTIVE</text>

  <!-- Medical Gas Wall Outlet (Green) -->
  <rect x="340" y="140" width="120" height="50" rx="6" fill="#15803d" stroke="#16a34a" stroke-width="2" />
  <circle cx="400" cy="165" r="14" fill="#22c55e" stroke="#14532d" stroke-width="2" />
  <text x="368" y="170" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">OXYGEN</text>

  <!-- Flowmeter Housing -->
  <rect x="360" y="190" width="80" height="40" fill="url(#metalGrad)" stroke="#475569" stroke-width="2" />
  <rect x="320" y="230" width="160" height="360" rx="10" fill="#0f172a" stroke="#475569" stroke-width="3" />

  <!-- Glass Rotameter Tube -->
  <rect x="355" y="250" width="90" height="310" rx="8" fill="url(#tubeGrad)" stroke="#64748b" stroke-width="2" />

  <!-- Scale Markings (L/min) -->
  <!-- 15 L/min -->
  <line x1="365" y1="270" x2="385" y2="270" stroke="#f8fafc" stroke-width="2" />
  <text x="395" y="275" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">15</text>

  <!-- 12 L/min -->
  <line x1="365" y1="305" x2="380" y2="305" stroke="#94a3b8" stroke-width="1.5" />
  <text x="395" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">12</text>

  <!-- 10 L/min -->
  <line x1="365" y1="340" x2="385" y2="340" stroke="#f8fafc" stroke-width="2" />
  <text x="395" y="345" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">10</text>

  <!-- 8 L/min (CRITICAL OVERFLOW TARGET) -->
  <line x1="365" y1="375" x2="390" y2="375" stroke="#ef4444" stroke-width="3" />
  <text x="400" y="380" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">8.0</text>

  <!-- 6 L/min -->
  <line x1="365" y1="410" x2="380" y2="410" stroke="#94a3b8" stroke-width="1.5" />
  <text x="395" y="415" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">6</text>

  <!-- 4 L/min -->
  <line x1="365" y1="445" x2="380" y2="445" stroke="#94a3b8" stroke-width="1.5" />
  <text x="395" y="450" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">4</text>

  <!-- 2 L/min (Pediatric Max Safe Limit Line) -->
  <line x1="360" y1="480" x2="430" y2="480" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2" />
  <text x="395" y="485" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">2.0 MAX</text>

  <!-- 1 L/min -->
  <line x1="365" y1="515" x2="380" y2="515" stroke="#94a3b8" stroke-width="1.5" />
  <text x="395" y="520" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">1</text>

  <!-- Float Indicator Ball (RESTING EXACTLY AT 8.0 L/min) -->
  <circle cx="380" cy="375" r="16" fill="url(#ballGrad)" stroke="#f8fafc" stroke-width="1.5" filter="url(#glow)" />
  <!-- Center marker line of float ball -->
  <line x1="364" y1="375" x2="396" y2="375" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2" />

  <!-- Lower Valve & Control Knob -->
  <rect x="375" y="590" width="50" height="35" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5" />
  <circle cx="400" cy="650" r="32" fill="#15803d" stroke="#22c55e" stroke-width="3" />
  <text x="382" y="655" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">FLOW</text>

  <!-- Tubing Nipple & Clear Nasal Cannula Tubing -->
  <rect x="390" y="682" width="20" height="25" fill="url(#metalGrad)" stroke="#475569" />
  <path d="M 400 707 C 400 740, 480 750, 520 780" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="10" stroke-linecap="round" />
  <path d="M 400 707 C 400 740, 480 750, 520 780" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Side Callout Legend -->
  <g transform="translate(520, 320)">
    <rect width="210" height="150" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2" opacity="0.95" />
    <text x="16" y="32" fill="#ef4444" font-family="sans-serif" font-size="15" font-weight="800">VISIBLE OBSERVATION</text>
    <text x="16" y="58" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13">Float level: 8.0 L/min</text>
    <text x="16" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Pediatric Limit: 2.0 L/min</text>
    <text x="16" y="104" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="600">CRITICAL SAFETY DELTA</text>
    <text x="16" y="126" fill="#cbd5e1" font-family="sans-serif" font-size="11">+6.0 L/min Overdose Risk</text>
  </g>

  <g transform="translate(100, 320)">
    <rect width="180" height="130" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="30" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">SPECIFICATION</text>
    <text x="16" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Device: Thorpe Tube</text>
    <text x="16" y="74" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Gas: 100% Medical O2</text>
    <text x="16" y="94" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Range: 0-15 L/min</text>
    <text x="16" y="114" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11">Interface: Cannula</text>
  </g>
</svg>
