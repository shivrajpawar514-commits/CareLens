<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0b0f19" />
  <!-- Unidentifiable custom chassis without clinical labeling -->
  <rect x="140" y="80" width="520" height="440" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="3" />
  
  <!-- Mystery dials and connectors -->
  <circle cx="280" cy="220" r="60" fill="#334155" stroke="#94a3b8" stroke-width="4" />
  <line x1="280" y1="220" x2="310" y2="180" stroke="#f1f5f9" stroke-width="6" stroke-linecap="round" />
  <text x="250" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14">UNMARKED DIAL</text>

  <circle cx="500" cy="220" r="45" fill="#334155" stroke="#94a3b8" stroke-width="4" />
  <text x="460" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14">UNKNOWN PORT</text>

  <rect x="220" y="360" width="360" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="240" y="398" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="16">NO PROTOCOL MARKINGS FOUND</text>
  
  <rect x="160" y="470" width="480" height="42" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
  <text x="180" y="497" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">CLINICAL DE-IDENTIFIED: AMBIGUOUS NON-PROTOCOL HARDWARE</text>
</svg>
