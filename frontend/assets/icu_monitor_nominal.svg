<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bezelGradNom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="ecgGlowNom">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Monitor Bezel -->
  <rect width="1000" height="700" rx="20" fill="url(#bezelGradNom)" stroke="#475569" stroke-width="6" />

  <!-- Display Area -->
  <rect x="25" y="25" width="950" height="650" rx="8" fill="#020617" />

  <!-- Header Banner -->
  <rect x="25" y="25" width="950" height="50" fill="#0f172a" />
  <text x="45" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">BED 04 | ADULT ICU | PATIENT #31849</text>
  <rect x="660" y="33" width="295" height="34" rx="6" fill="#16a34a" />
  <text x="680" y="56" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">ALL PARAMETERS NOMINAL</text>

  <!-- Channel 1: ECG Lead II (Green) -->
  <rect x="40" y="90" width="220" height="125" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2" />
  <text x="55" y="118" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">ECG  HR (bpm)</text>
  <text x="55" y="195" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="76" font-weight="800" filter="url(#ecgGlowNom)">72</text>
  <text x="190" y="135" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">NORM</text>
  <path d="M 280 155 L 360 155 L 375 145 L 385 165 L 395 105 L 410 190 L 420 155 L 450 155 
           L 470 140 L 490 155 L 570 155 L 585 145 L 595 165 L 605 105 L 620 190 L 630 155 
           L 660 155 L 680 140 L 700 155 L 780 155 L 795 145 L 805 165 L 815 105 L 830 190 
           L 840 155 L 870 155 L 890 140 L 910 155 L 940 155" fill="none" stroke="#22c55e" stroke-width="3" filter="url(#ecgGlowNom)" />

  <!-- Channel 2: SpO2 Pulse Oximetry (Cyan) -->
  <rect x="40" y="235" width="220" height="125" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="2" />
  <text x="55" y="263" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">SpO2  %</text>
  <text x="55" y="340" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="76" font-weight="800" filter="url(#ecgGlowNom)">98</text>
  <text x="190" y="280" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">NORM</text>
  <path d="M 280 320 Q 310 320 325 260 Q 335 240 345 270 Q 355 265 370 320 
           Q 420 320 435 260 Q 445 240 455 270 Q 465 265 480 320 
           Q 530 320 545 260 Q 555 240 565 270 Q 575 265 590 320 
           Q 640 320 655 260 Q 665 240 675 270 Q 685 265 700 320 
           Q 750 320 765 260 Q 775 240 785 270 Q 795 265 810 320 
           L 940 320" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#ecgGlowNom)" />

  <!-- Channel 3: Blood Pressure NIBP (White/Cyan) -->
  <rect x="40" y="380" width="220" height="125" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="55" y="408" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">NIBP  SYS/DIA</text>
  <text x="55" y="480" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="800">120/80</text>
  <text x="180" y="445" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">(93)</text>
  <!-- Non-invasive BP flatline indicator between cuff cycles -->
  <line x1="280" y1="442" x2="940" y2="442" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />
  <text x="480" y="435" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13">AUTO NIBP INTERVAL: 15 MIN</text>

  <!-- Channel 4: Respiration Rate (Yellow) -->
  <rect x="40" y="525" width="220" height="125" rx="8" fill="#422006" stroke="#ca8a04" stroke-width="2" />
  <text x="55" y="553" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">RESP  (br/min)</text>
  <text x="55" y="630" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="76" font-weight="800">16</text>
  <text x="190" y="570" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">NORM</text>
  <path d="M 280 600 Q 330 550 380 600 Q 430 650 480 600 
           Q 530 550 580 600 Q 630 650 680 600 
           Q 730 550 780 600 Q 830 650 880 600 L 940 600" fill="none" stroke="#facc15" stroke-width="3" />
</svg>
