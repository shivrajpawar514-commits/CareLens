<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="glareGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)" />
      <stop offset="35%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="70%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Dark Underexposed Room -->
  <rect width="800" height="600" fill="#030712" />

  <!-- Obscured Machine Chassis in shadows -->
  <rect x="150" y="80" width="500" height="440" rx="16" fill="#111827" stroke="#1f2937" stroke-width="2" />

  <!-- Partially readable display behind extreme light reflection/glare -->
  <rect x="180" y="120" width="440" height="340" rx="8" fill="#020617" />

  <!-- Blurred traces underneath -->
  <g filter="url(#blurFilter)">
    <path d="M 200 200 L 300 200 L 320 160 L 340 240 L 360 200 L 500 200" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.4" />
    <path d="M 200 300 L 300 300 L 320 270 L 340 330 L 360 300 L 500 300" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.4" />
    <text x="240" y="240" fill="#22c55e" font-size="48" font-family="'JetBrains Mono', monospace" opacity="0.3">??</text>
  </g>

  <!-- Severe Optical Flash/Glare Artifact obscuring values -->
  <ellipse cx="400" cy="280" rx="220" ry="160" fill="url(#glareGrad)" />

  <!-- Camera Artifact warning banner -->
  <rect x="220" y="470" width="360" height="40" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
  <text x="240" y="495" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">IMAGE QUALITY: SEVERE GLARE DETECTED</text>
</svg>
